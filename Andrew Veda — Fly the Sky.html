<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Andrew Veda — Fly the Sky</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--card:#fffdf8;--ink:#1e1b15;--ink3:#7a7268;--gold:#9a6f1e;--goldf:rgba(154,111,30,.1);--pill:rgba(255,253,248,.85);
--serif:'Playfair Display',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1d1a14;--ink:#f3eee2;--ink3:#a39a8b;--gold:#e0b45a;--goldf:rgba(224,180,90,.12);--pill:rgba(29,26,20,.8)}}
:root[data-theme="dark"]{--card:#1d1a14;--ink:#f3eee2;--ink3:#a39a8b;--gold:#e0b45a;--goldf:rgba(224,180,90,.12);--pill:rgba(29,26,20,.8)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#dfe9f2;font-family:var(--sans);touch-action:none;overscroll-behavior:none}
canvas#g{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.pill{background:var(--pill);color:var(--ink);border:1px solid var(--goldf);border-radius:99px;padding:7px 13px;font-size:.75rem;font-weight:600;letter-spacing:.06em;backdrop-filter:blur(8px)}
.pill b{color:var(--gold)}
#mm{width:110px;height:82px;border-radius:8px;border:1px solid var(--goldf);background:var(--pill)}
#card{position:fixed;left:50%;bottom:0;width:min(560px,calc(100% - 20px));transform:translate(-50%,115%);transition:transform .35s cubic-bezier(.2,.9,.3,1);background:var(--card);color:var(--ink);border:1px solid var(--goldf);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:52vh;overflow-y:auto;touch-action:pan-y}
#card.on{transform:translate(-50%,0)}
#card .k{font-size:.65rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#card h3{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:3px 0 8px;line-height:1.15}
#card p{font-family:Georgia,serif;font-size:1rem;line-height:1.55;color:var(--ink3)}
#links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#links a{color:var(--gold);border:1px solid var(--goldf);background:var(--goldf);border-radius:99px;padding:9px 14px;font-size:.78rem;font-weight:600;text-decoration:none;min-height:40px;display:flex;align-items:center}
#x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--ink3);font-size:1.5rem;width:40px;height:40px}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,18,14,.55);backdrop-filter:blur(6px);padding:20px;transition:opacity .4s}
#intro.off{opacity:0;pointer-events:none}
#intro div{background:var(--card);color:var(--ink);border-radius:20px;padding:28px 24px;max-width:380px;text-align:center}
#intro h1{font-family:var(--serif);font-size:2rem;font-weight:600;margin:6px 0}
#intro .k{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
#intro p{font-family:Georgia,serif;color:var(--ink3);line-height:1.5;margin:10px 0 18px}
#intro button{background:var(--gold);color:#fff;border:0;border-radius:99px;padding:14px 30px;font-size:.9rem;font-weight:600;letter-spacing:.05em;min-height:48px}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="hud"><div class="pill">✦ <b id="cnt">0</b> / <span id="tot"></span> discovered</div><canvas id="mm" width="220" height="164"></canvas></div>
<div id="card"><button id="x" aria-label="Close">×</button><div class="k" id="ck"></div><h3 id="ct"></h3><p id="cp"></p><div id="links"></div></div>
<div id="intro"><div><div class="k">Chess ◆ Language ◆ Systems ◆ Thinking</div><h1>Andrew Veda</h1>
<p>Take the controls. Touch and drag anywhere to steer your plane (drag farther to go faster). On a keyboard, use arrow keys or WASD. Fly to the islands to explore.</p>
<button id="go">Take off ✈</button></div></div>

<script>
const D=[
{x:1600,y:1200,r:120,i:'🧭',c:'#c49a3c',k:'About',t:'In pursuit of polymathic thinking',b:'Assistant Professor of English, classical Tamil translator, and bullet chess player in the top 0.3% globally. I design gamified learning experiences so that learning English becomes the ability to think anywhere.',l:[['Medium','https://medium.com/@andrewveda'],['GitHub','https://github.com/andrewveda']]},
{x:500,y:480,r:110,i:'📜',c:'#7e63a8',k:'Research',t:'Scholarship',b:'Zoosemiotics and phytosemiotics: nature as an active participant in meaning-making. Also a theory of aesthetics as individuality in motion. Translating all 402 poems of the Kuṟuntokai into English acrostic verse.',l:[['The Guilty Reader','https://zenodo.org/records/20119928'],['Google Scholar','https://scholar.google.com/citations?user=CU7TljcAAAAJ']]},
{x:2700,y:480,r:110,i:'🎓',c:'#4f86ad',k:'Teaching',t:'A classroom for polymaths',b:'The classroom is a design problem. Every session is an intervention meant to shift how a student thinks. My current obsession: the cryptic crossword as a pedagogy of ambiguity.',l:[['Cryptic Crosswords in ESL','https://medium.com/@andrewveda/teachers-log-introducing-cryptic-crosswords-in-tertiary-level-esl-classrooms-13a500596038'],['Cognitive Framework','https://osf.io/preprints/psyarxiv/qw2pm_v2']]},
{x:500,y:1950,r:110,i:'♟️',c:'#6c8a5c',k:'Chess',t:'The game that sharpens everything',b:'Rated 2200+ in blitz and bullet. Chess teaches accountability: there is nowhere to hide, and every mistake is an opportunity for growth. Fail better.',l:[['Chess.com','https://www.chess.com/member/andrewveda'],['Lichess','https://lichess.org/av94'],['Why we fall for the Knight','https://medium.com/@andrewveda/why-every-chess-player-falls-for-the-knight-and-knight-forks-6e88ed599ea1']]},
{x:2700,y:1950,r:110,i:'🎤',c:'#cc8033',k:'Academic Work',t:'Publications & Talks',b:'Journal articles, conference papers, invited lectures and workshops across literature, semiotics, pedagogy and translation, including translation workshops at Loyola College, Chennai.',l:[['Google Scholar','https://scholar.google.com/citations?user=CU7TljcAAAAJ'],['ORCID','https://orcid.org/0000-0002-1226-6856'],['H·Commons','https://andrewveda.hcommons.org/']]},
{x:1600,y:250,r:100,i:'✉️',c:'#8a4848',k:'Get in touch',t:'Contact',b:'The best place to reach me is X. You will also find me on GitHub and Medium.',l:[['@andrewveda on X','https://twitter.com/andrewveda'],['GitHub','https://github.com/andrewveda']]},
{x:1600,y:2150,r:110,i:'🐴',c:'#2e6080',k:'Featured project',t:'Knight Trainer',b:'800,000+ knight puzzles powered by Stockfish, one of the world’s strongest chess engines.',l:[['Open Knight Trainer','https://andrewveda.github.io/knight-trainer/']]}
];
const A=[['🧩','Cryptic Clues','Fluid-intelligence training for creative-critical thinking.','https://andrewveda.github.io/cryptic/','#c49a3c'],
['♠️','A Quote A Day','Student-contributed wisdom. Personal reflection, daily.','https://andrewveda.github.io/a-quote-a-day/','#6c8a5c'],
['⚡','Wordle Blitz','Vocabulary under pressure.','https://andrewveda.github.io/SRM-VEC-English-PWA/wordleblitz','#4f86ad'],
['🗣️','Vox Velocity','IELTS & GRE vocabulary, letter by letter.','https://andrewveda.github.io/SRM-VEC-English-PWA/buttons/vox-velocity-directory','#7e63a8'],
['📚','Book Insights','Nonfiction condensed into match-the-following games.','https://andrewveda.github.io/SRM-VEC-English-PWA/buttons/bookinsights','#cc8033'],
['🧩','Jigsaw','Connecting quotes, ideas and language.','https://andrewveda.github.io/jigsaw/','#8a4848']];
A.forEach((a,n)=>{const g=n/6*Math.PI*2-Math.PI/2;D.push({x:1600+Math.cos(g)*640,y:1200+Math.sin(g)*560,r:62,i:a[0],c:a[4],k:'SRM VEC English App',t:a[1],b:a[2],l:[['Open →',a[3]]]})});
const W=3200,H=2400,$=id=>document.getElementById(id);
$('tot').textContent=D.length;
const cv=$('g'),ctx=cv.getContext('2d'),mm=$('mm'),mc=mm.getContext('2d');
let vw,vh,dpr,z;
function rs(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;z=Math.min(vw,vh)<700?.7:1}
addEventListener('resize',rs);rs();
const dark=()=>matchMedia('(prefers-color-scheme:dark)').matches&&document.documentElement.dataset.theme!=='light';
const P={x:1600,y:1480,h:-Math.PI/2,s:150,bank:0,tr:[]};
const cam={x:P.x,y:P.y};
const clouds=Array.from({length:34},()=>({x:Math.random()*2400,y:Math.random()*1800,w:80+Math.random()*140,p:.3+Math.random()*.5}));
let stick=null,keys={},seen=new Set(),active=null,dismissed=null,t0=0;
cv.addEventListener('pointerdown',e=>{if(!stick){stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(stick&&e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY}});
const up=e=>{if(stick&&e.pointerId===stick.id)stick=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
$('go').onclick=()=>$('intro').classList.add('off');
$('x').onclick=()=>{dismissed=active;hide()};
const card=$('card');
function show(d){$('ck').textContent=d.k;$('ct').textContent=d.t;$('cp').textContent=d.b;
$('links').innerHTML=d.l.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join('');card.classList.add('on')}
function hide(){card.classList.remove('on')}
const ang=a=>Math.atan2(Math.sin(a),Math.cos(a));
function update(dt){
 let turn=0,spd=150,tgt=null;
 if(stick){const dx=stick.x-stick.ox,dy=stick.y-stick.oy,m=Math.min(1,Math.hypot(dx,dy)/70);
  if(m>.12){tgt=Math.atan2(dy,dx);spd=150+m*150}}
 if(tgt!==null){const d=ang(tgt-P.h),mx=3.2*dt;const s=Math.max(-mx,Math.min(mx,d));P.h+=s;turn=s/dt/3.2}
 if(keys.arrowleft||keys.a){P.h-=2.8*dt;turn=-1}
 if(keys.arrowright||keys.d){P.h+=2.8*dt;turn=1}
 if(keys.arrowup||keys.w)spd=300;if(keys.arrowdown||keys.s)spd=90;
 P.s+=(spd-P.s)*Math.min(1,dt*3);P.bank+=(turn-P.bank)*Math.min(1,dt*6);
 P.x+=Math.cos(P.h)*P.s*dt;P.y+=Math.sin(P.h)*P.s*dt;
 if(P.x<60||P.x>W-60||P.y<60||P.y>H-60){const c=Math.atan2(H/2-P.y,W/2-P.x);P.h+=ang(c-P.h)*Math.min(1,dt*4);P.x=Math.max(40,Math.min(W-40,P.x));P.y=Math.max(40,Math.min(H-40,P.y))}
 P.tr.push([P.x-Math.cos(P.h)*18,P.y-Math.sin(P.h)*18]);if(P.tr.length>45)P.tr.shift();
 cam.x+=(P.x-cam.x)*Math.min(1,dt*4);cam.y+=(P.y-cam.y)*Math.min(1,dt*4);
 let near=null,nd=1e9;
 D.forEach(d=>{const k=Math.hypot(d.x-P.x,d.y-P.y);if(k<d.r+70&&k<nd){nd=k;near=d}});
 if(near!==active){active=near;if(!near){dismissed=null;hide()}else if(near!==dismissed){show(near);if(!seen.has(near)){seen.add(near);$('cnt').textContent=seen.size}}}
}
function island(d,t){
 const by=Math.sin(t*1.2+d.x)*6,x=d.x,y=d.y+by,r=d.r,vis=seen.has(d);
 ctx.fillStyle='rgba(0,0,0,.1)';ctx.beginPath();ctx.ellipse(x,y+r*1.1,r*.9,r*.25,0,0,7);ctx.fill();
 ctx.fillStyle=dark()?'#4a3f33':'#8a7660';ctx.beginPath();ctx.moveTo(x-r*1.25,y);ctx.lineTo(x+r*1.25,y);ctx.lineTo(x+r*.2,y+r*.95);ctx.lineTo(x-r*.3,y+r*.7);ctx.closePath();ctx.fill();
 ctx.fillStyle=d.c;ctx.beginPath();ctx.ellipse(x,y,r*1.3,r*.5,0,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(x,y-r*.06,r*1.1,r*.36,0,0,7);ctx.fill();
 ctx.font=`${r*.85}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.i,x,y-r*.45);
 ctx.font=`600 ${Math.max(13,r*.2)}px "Playfair Display",Georgia,serif`;ctx.fillStyle=dark()?'#f3eee2':'#1e1b15';
 ctx.fillText(d.t.length>22?d.t.slice(0,21)+'…':d.t,x,y+r*.72);
 if(vis){ctx.font='14px sans-serif';ctx.fillText('✦',x+r*1.1,y-r*.7)}
}
function plane(){
 ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.h);
 ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(6,14,22,8,0,0,7);ctx.fill();
 const w=1-Math.abs(P.bank)*.35;
 ctx.fillStyle='#c0392b';ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-10,-30*w);ctx.lineTo(4,-30*w);ctx.lineTo(10,0);ctx.lineTo(4,30*w);ctx.lineTo(-10,30*w);ctx.closePath();ctx.fill();
 ctx.fillStyle='#f5ede0';ctx.beginPath();ctx.moveTo(-26,-9);ctx.lineTo(-20,-13*w);ctx.lineTo(-18,0);ctx.lineTo(-20,13*w);ctx.lineTo(-26,9);ctx.fill();
 ctx.beginPath();ctx.ellipse(0,0,24,7,0,0,7);ctx.fill();
 ctx.fillStyle='#4f86ad';ctx.beginPath();ctx.ellipse(3,0,6,4,0,0,7);ctx.fill();
 ctx.strokeStyle='#333';ctx.lineWidth=3;const pa=performance.now()/25;ctx.beginPath();ctx.moveTo(24+Math.cos(pa)*2,Math.sin(pa)*13);ctx.lineTo(24-Math.cos(pa)*2,-Math.sin(pa)*13);ctx.stroke();
 ctx.restore();
}
function draw(t){
 const dk=dark();
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const g=ctx.createLinearGradient(0,0,0,vh);
 if(dk){g.addColorStop(0,'#0f1626');g.addColorStop(1,'#2a2f45')}else{g.addColorStop(0,'#a9cfe8');g.addColorStop(1,'#f4ead6')}
 ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
 ctx.fillStyle=dk?'rgba(255,255,255,.07)':'rgba(255,255,255,.7)';
 clouds.forEach(c=>{const sx=(((c.x-cam.x*c.p)%(vw+500))+vw+500)%(vw+500)-250,sy=(((c.y-cam.y*c.p)%(vh+300))+vh+300)%(vh+300)-150;
  ctx.beginPath();ctx.ellipse(sx,sy,c.w,c.w*.28,0,0,7);ctx.ellipse(sx+c.w*.4,sy-c.w*.1,c.w*.55,c.w*.25,0,0,7);ctx.fill()});
 ctx.setTransform(dpr*z,0,0,dpr*z,dpr*(vw/2-cam.x*z),dpr*(vh/2-cam.y*z));
 ctx.strokeStyle='rgba(154,111,30,.25)';ctx.lineWidth=4;ctx.setLineDash([14,14]);ctx.strokeRect(20,20,W-40,H-40);ctx.setLineDash([]);
 D.slice().sort((a,b)=>a.y-b.y).forEach(d=>island(d,t));
 ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineCap='round';
 for(let i=1;i<P.tr.length;i++){ctx.lineWidth=i/4;ctx.globalAlpha=i/P.tr.length*.7;ctx.beginPath();ctx.moveTo(P.tr[i-1][0],P.tr[i-1][1]);ctx.lineTo(P.tr[i][0],P.tr[i][1]);ctx.stroke()}
 ctx.globalAlpha=1;plane();
 // compass to nearest undiscovered
 let best=null,bd=1e9;D.forEach(d=>{if(!seen.has(d)){const k=Math.hypot(d.x-P.x,d.y-P.y);if(k<bd){bd=k;best=d}}});
 if(best&&bd>260){const a=Math.atan2(best.y-P.y,best.x-P.x);ctx.save();ctx.translate(P.x+Math.cos(a)*85,P.y+Math.sin(a)*85);ctx.rotate(a);
  ctx.fillStyle='#c49a3c';ctx.globalAlpha=.9;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-9);ctx.lineTo(-4,0);ctx.lineTo(-8,9);ctx.fill();ctx.restore()}
 // joystick
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(stick){const dx=stick.x-stick.ox,dy=stick.y-stick.oy,m=Math.hypot(dx,dy),k=Math.min(1,70/(m||1));
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.fillStyle='rgba(154,111,30,.35)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(stick.ox,stick.oy,70,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(stick.ox+dx*k,stick.oy+dy*k,26,0,7);ctx.fill();ctx.stroke()}
 // minimap
 mc.clearRect(0,0,220,164);const sx=220/W,sy=164/H;
 D.forEach(d=>{mc.fillStyle=seen.has(d)?'#c49a3c':'rgba(120,120,120,.6)';mc.beginPath();mc.arc(d.x*sx,d.y*sy,d.r>80?5:3,0,7);mc.fill()});
 mc.fillStyle='#c0392b';mc.beginPath();mc.arc(P.x*sx,P.y*sy,5,0,7);mc.fill();
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;t0+=dt;update(dt);draw(t0);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
